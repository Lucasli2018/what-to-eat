<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>今天吃啥 · 转盘替你做决定</title>
<meta name="theme-color" content="#ff6b35" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="favicon.svg" />
<style>
  :root{
    --primary:#ff6b35;
    --primary2:#ffa552;
    --bg:#fff7f0;
    --card:#ffffff;
    --text:#2d2118;
    --text2:#9b8a7c;
    --line:#f2e4d8;
    --accent-soft:#fffaf5;
    --shadow-panel:0 4px 20px rgba(180,120,80,.08);
    --shadow-card:0 10px 34px rgba(190,120,80,.15);
    --shadow-wheel:0 12px 30px rgba(200,120,70,.22);
    --radius:18px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1a1410;
      --card:#241c16;
      --text:#f3e9e0;
      --text2:#a8917f;
      --line:#3a2e24;
      --accent-soft:#2a201a;
      --shadow-panel:0 4px 20px rgba(0,0,0,.35);
      --shadow-card:0 10px 34px rgba(0,0,0,.45);
      --shadow-wheel:0 12px 30px rgba(0,0,0,.5);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    background-image:radial-gradient(60vw 60vw at 12% -8%,#ffe9dc 0%,transparent 55%),
                     radial-gradient(55vw 55vw at 105% 0%,#ffeede 0%,transparent 50%);
    background-attachment:fixed;
  }
  @media (prefers-color-scheme: dark){
    body{background-image:radial-gradient(60vw 60vw at 12% -8%,#2a1d14 0%,transparent 55%),
                            radial-gradient(55vw 55vw at 105% 0%,#271c14 0%,transparent 50%);}
  }
  .app{max-width:480px;margin:0 auto;padding:22px 18px 40px;}

  /* Hero */
  .hero{text-align:center;margin-bottom:18px;}
  .hero h1{
    margin:0;font-size:30px;font-weight:800;letter-spacing:1px;
    background:linear-gradient(120deg,var(--primary),var(--primary2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hero p{margin:6px 0 0;font-size:13px;color:var(--text2);}

  /* Toolbar */
  .toolbar{display:flex;gap:10px;justify-content:center;margin-bottom:14px;}
  .ghost{
    border:1px solid var(--line);background:var(--card);color:var(--text2);
    font-weight:700;font-size:14px;padding:9px 16px;border-radius:999px;cursor:pointer;
    box-shadow:var(--shadow-panel);transition:transform .18s ease,border-color .18s ease,color .18s ease;
  }
  .ghost:hover{transform:translateY(-1px);border-color:var(--primary);color:var(--primary);}
  .ghost.active{border-color:var(--primary);color:var(--primary);}

  /* Settings */
  .settings{display:none;background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:16px;
    box-shadow:var(--shadow-panel);animation:fadeIn .25s ease both;}
  .settings.open{display:block;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .field{margin-bottom:14px;}
  .field:last-child{margin-bottom:0;}
  .field-label{font-size:13px;font-weight:700;color:var(--text2);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
  .field-label b{color:var(--primary);font-size:15px;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    border:1px solid var(--line);background:var(--bg);color:var(--text);
    font-size:13px;font-weight:600;padding:7px 13px;border-radius:999px;cursor:pointer;
    transition:all .18s ease;user-select:none;
  }
  .chip:hover{border-color:var(--primary);}
  .chip.on{background:linear-gradient(120deg,var(--primary),var(--primary2));border-color:transparent;color:#fff;box-shadow:0 4px 12px rgba(255,107,53,.28);}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:999px;
    background:linear-gradient(90deg,var(--primary) var(--fill,40%),var(--line) var(--fill,40%));outline:none;margin-top:4px;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;
    background:#fff;border:3px solid var(--primary);cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.15);}
  input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--primary);cursor:pointer;}

  /* 我的食物 */
  .add-btn{font-size:13px;color:var(--primary);cursor:pointer;font-weight:700;}
  .add-btn:hover{opacity:.7;}
  .custom-list{display:flex;flex-wrap:wrap;gap:8px;}
  .custom-item{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);
    border-radius:999px;padding:6px 6px 6px 12px;font-size:13px;color:var(--text);}
  .custom-item .del{width:18px;height:18px;border-radius:50%;background:var(--line);color:var(--text2);border:none;cursor:pointer;
    font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;}
  .custom-item .del:hover{background:var(--primary);color:#fff;}
  .custom-form{margin-top:12px;background:var(--accent-soft);border-radius:12px;padding:12px;animation:fadeIn .2s ease both;}
  .f-input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 11px;
    font-size:14px;margin-bottom:8px;color:var(--text);font-family:inherit;box-sizing:border-box;}
  .f-input:focus{outline:none;border-color:var(--primary);}
  .f-num{width:84px;}
  .f-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2);margin-bottom:6px;}
  .f-actions{display:flex;gap:8px;margin-top:4px;}
  .f-actions .btn{flex:1;}
  .f-actions .btn.primary{flex:2;}

  /* Stage / wheel */
  .stage{display:flex;flex-direction:column;align-items:center;margin:6px 0 4px;}
  .wheel-wrap{position:relative;width:min(86vw,340px);aspect-ratio:1/1;}
  canvas{width:100%;height:100%;display:block;filter:drop-shadow(var(--shadow-wheel));border-radius:50%;}
  .pointer{position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:0;height:0;
    border-left:15px solid transparent;border-right:15px solid transparent;border-top:28px solid var(--primary);
    filter:drop-shadow(0 3px 4px rgba(180,90,40,.4));z-index:5;border-radius:3px;}
  .pointer::after{content:"";position:absolute;top:-30px;left:-6px;width:12px;height:12px;border-radius:50%;background:var(--primary);}
  .spin-btn{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:88px;height:88px;border-radius:50%;border:none;cursor:pointer;z-index:6;
    background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;font-size:22px;font-weight:800;
    box-shadow:0 8px 22px rgba(255,107,53,.4),inset 0 2px 4px rgba(255,255,255,.4);
    transition:transform .15s ease,opacity .2s ease;
  }
  .spin-btn:active{transform:translate(-50%,-50%) scale(.94);}
  .spin-btn:disabled{opacity:.7;cursor:default;}
  .hint{margin-top:14px;font-size:13px;color:var(--text2);min-height:18px;text-align:center;}

  /* Result */
  .result{display:none;margin:18px 0;animation:fadeIn .25s ease both;}
  .result.show{display:block;}
  .result-card{
    position:relative;background:var(--card);border-radius:var(--radius);padding:22px 20px 18px;text-align:center;
    box-shadow:var(--shadow-card);animation:pop .5s cubic-bezier(.2,1.4,.5,1) both;overflow:hidden;
  }
  .result-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--primary),var(--primary2));animation:breathe 2.4s ease-in-out infinite;}
  @keyframes breathe{0%,100%{opacity:.55;}50%{opacity:1;}}
  @keyframes pop{from{opacity:0;transform:scale(.88) translateY(8px);}to{opacity:1;transform:none;}}
  .result-emoji{font-size:56px;line-height:1;margin-bottom:6px;animation:emojiPop .6s cubic-bezier(.2,1.6,.5,1) both;}
  @keyframes emojiPop{0%{transform:scale(0) rotate(-22deg);}60%{transform:scale(1.28) rotate(8deg);}100%{transform:scale(1) rotate(0);}}
  .result-name{font-size:26px;font-weight:800;margin:2px 0 8px;letter-spacing:1px;}
  .result-meta{display:flex;gap:8px;justify-content:center;align-items:center;margin-bottom:12px;}
  .result-meta span{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--text2);background:var(--accent-soft);padding:5px 14px;border-radius:999px;}
  .result-meta b{color:var(--text);font-weight:800;}
  .result-reason{position:relative;font-size:14px;color:var(--text);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--line);border-radius:14px;padding:11px 30px;margin-bottom:16px;line-height:1.6;}
  .result-reason::before,.result-reason::after{position:absolute;font-size:22px;font-weight:800;color:var(--primary);opacity:.4;line-height:1;}
  .result-reason::before{content:"❝";left:10px;top:7px;}
  .result-reason::after{content:"❞";right:10px;bottom:3px;}
  .result-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .btn{border:none;border-radius:999px;padding:13px 8px;font-size:15px;font-weight:800;cursor:pointer;white-space:nowrap;transition:transform .15s ease,opacity .2s ease,box-shadow .2s ease,color .2s ease;}
  .btn:active{transform:scale(.97);}
  .btn.primary{grid-column:1/-1;background:linear-gradient(120deg,var(--primary),var(--primary2));color:#fff;box-shadow:0 6px 16px rgba(255,107,53,.32);text-decoration:none;display:block;text-align:center;}
  .btn.primary:hover{box-shadow:0 8px 20px rgba(255,107,53,.42);}
  .btn.ghost2{background:var(--bg);color:var(--text2);box-shadow:inset 0 0 0 1px var(--line);}
  .btn.ghost2:hover:not(:disabled){color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary);}
  .btn.ghost2.faved{color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary);background:var(--accent-soft);}
  .btn:disabled{opacity:.55;cursor:default;}

  /* History */
  .history{margin-top:22px;}
  .section-title{font-size:14px;font-weight:800;color:var(--text2);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
  .section-title span.clear{font-size:12px;color:var(--text2);cursor:pointer;font-weight:600;}
  .section-title span.clear:hover{color:var(--primary);}
  .history-list{display:flex;flex-wrap:wrap;gap:8px;}
  .history-item{display:inline-flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);
    border-radius:999px;padding:6px 12px;font-size:13px;color:var(--text);box-shadow:var(--shadow-panel);cursor:pointer;
    transition:transform .15s ease,border-color .15s ease;}
  .history-item:hover{transform:translateY(-1px);border-color:var(--primary);}
  .history-empty{font-size:13px;color:var(--text2);}
  .foot{text-align:center;font-size:11px;color:var(--text2);margin-top:26px;line-height:1.6;}

  /* 增强：旋转脉冲态 / 呼吸光 / emoji弹跳 / toast */
  .spin-btn.spinning{animation:pulse 1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 8px 22px rgba(255,107,53,.4),inset 0 2px 4px rgba(255,255,255,.4);}50%{box-shadow:0 8px 32px rgba(255,107,53,.75),inset 0 2px 4px rgba(255,255,255,.4);}}
  .toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);background:rgba(45,33,24,.92);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:80vw;text-align:center;}
  .toast.show{opacity:1;transform:translate(-50%,0);}

  /* 命运懂你 · 偏好画像 */
  .profile{margin-top:14px;background:linear-gradient(135deg,rgba(255,107,53,.09),rgba(255,161,82,.04));
    border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow-panel);}
  .pp-sub{font-size:11px;color:var(--text2);font-weight:600;margin-left:6px;}
  .pp-top{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
  .pp-chip{display:inline-flex;align-items:center;gap:5px;background:rgba(255,107,53,.13);
    border:1px solid rgba(255,107,53,.28);border-radius:999px;padding:4px 11px;font-size:13px;font-weight:700;color:var(--primary);}
  .pp-insight{color:var(--text2);font-size:12.5px;line-height:1.5;}
  .pp-empty{color:var(--text2);font-size:13px;}
</style>
</head>
<body>
<div class="app">
  <div class="hero">
    <h1>今天吃啥</h1>
    <p>把纠结交给转盘，把责任交给命运</p>
  </div>

  <div class="toolbar">
    <button class="ghost" id="toggleSettings">⚙️ 调整条件</button>
    <button class="ghost" id="soundBtn">🔊 音效</button>
    <button class="ghost" id="resetBtn">🔄 重置</button>
  </div>

  <div class="settings" id="settings">
    <div class="field">
      <div class="field-label">跟谁吃</div>
      <div class="chips" id="sceneChips"></div>
    </div>
    <div class="field">
      <div class="field-label">人均预算 <b id="budgetVal">¥60</b></div>
      <input type="range" id="budget" min="8" max="200" step="1" value="60" />
    </div>
    <div class="field">
      <div class="field-label">忌口 / 偏好（永不放宽）</div>
      <div class="chips" id="avoidChips"></div>
    </div>
    <div class="field">
      <div class="field-label">我的食物 <span class="add-btn" id="addCustomBtn">＋ 添加</span></div>
      <div class="custom-list" id="customList"></div>
      <div class="custom-form" id="customForm" style="display:none">
        <input class="f-input" id="cfName" placeholder="菜名，如 外婆家酸菜鱼" />
        <input class="f-input" id="cfEmoji" placeholder="emoji，如 🐟（可留空）" />
        <div class="f-row"><span>人均 ¥</span><input class="f-input f-num" id="cfPrice" type="number" value="30" min="1"/></div>
        <div class="field-label" style="margin-top:4px">辣度 <b id="cfSpicyVal">微辣</b></div>
        <input type="range" id="cfSpicy" min="0" max="3" step="1" value="1" />
        <div class="field-label" style="margin-top:10px">标签</div>
        <div class="chips" id="cfTags"></div>
        <div class="field-label" style="margin-top:10px">适合场景</div>
        <div class="chips" id="cfScenes"></div>
        <div class="field-label" style="margin-top:10px">适合时段</div>
        <div class="chips" id="cfSlots"></div>
        <div class="f-actions">
          <button class="btn ghost2" id="cfCancel">取消</button>
          <button class="btn primary" id="cfSave">保存</button>
        </div>
      </div>
    </div>
  </div>

  <div class="stage">
    <div class="wheel-wrap">
      <div class="pointer"></div>
      <canvas id="wheel"></canvas>
      <button class="spin-btn" id="spinBtn">转</button>
    </div>
    <div class="hint" id="hint">点击中间按钮，让命运做决定</div>
  </div>

  <div class="result" id="result">
    <div class="result-card">
      <div class="result-emoji" id="rEmoji">🍜</div>
      <div class="result-name" id="rName">兰州拉面</div>
      <div class="result-meta">
        <span>人均 <b id="rPrice">¥18</b></span>
        <span id="rSpicy">🌶️ 微辣</span>
      </div>
      <div class="result-reason" id="rReason"></div>
      <div class="result-actions">
        <a class="btn primary" id="mapBtn" target="_blank" rel="noopener">📍 去地图找店</a>
        <button class="btn ghost2" id="rerollBtn">换一个（剩2次）</button>
        <button class="btn ghost2" id="favBtn">⭐ 收藏</button>
      </div>
    </div>
  </div>

  <div class="profile" id="profile">
    <div class="section-title">命运懂你 <span class="pp-sub">越转越准</span></div>
    <div class="profile-body" id="profileBody"></div>
  </div>

  <div class="history">
    <div class="section-title">最近吃过 <span class="clear" id="clearHistory">清空</span></div>
    <div class="history-list" id="historyList"></div>
  </div>

  <div class="foot">转盘替你做的决定，后悔也怪不到你头上 🐴</div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";

/* ---------- 食物库（64 条） ----------
   n 名称 e emoji p 人均 s 辣度0-3 t 标签[荤/素/海鲜/牛羊/猪/香菜/鸡/面]
   sc 场景[alone同事?] tm 时段[breakfast午餐?] */
const FOODS = [
  {n:'兰州拉面',e:'🍜',p:18,s:1,t:['荤','面'],sc:['alone','colleagues'],tm:['lunch','dinner']},

  {n:'炸酱面',e:'🍜',p:18,s:0,t:['荤'],sc:['alone','colleagues'],tm:['lunch','dinner']},
  {n:'日式咖喱饭',e:'🍛',p:30,s:1,t:['荤'],sc:['alone','colleagues','couple'],tm:['lunch','dinner']},
  {n:'寿司',e:'🍣',p:45,s:0,t:['荤','海鲜'],sc:['alone','couple'],tm:['lunch','dinner']},
  {n:'韩式拌饭',e:'🍚',p:28,s:2,t:['荤'],sc:['alone','colleagues'],tm:['lunch','dinner']},
  {n:'部队锅',e:'🍲',p:60,s:2,t:['荤','海鲜','猪'],sc:['friends','couple'],tm:['dinner']},
  {n:'火锅',e:'🔥',p:90,s:3,t:['荤','牛羊','猪','海鲜'],sc:['friends','family','couple'],tm:['dinner','night']},
  {n:'烧烤',e:'🍢',p:70,s:2,t:['荤','牛羊','猪'],sc:['friends'],tm:['dinner','night']},
  {n:'烤鱼',e:'🐟',p:80,s:2,t:['荤','海鲜'],sc:['friends','couple'],tm:['dinner','night']},

  {n:'煎饼果子',e:'🥞',p:12,s:1,t:['荤','香菜'],sc:['alone'],tm:['breakfast','lunch']},
  {n:'小笼包',e:'🥟',p:22,s:1,t:['荤','猪'],sc:['alone','colleagues'],tm:['breakfast','lunch']},
  {n:'豆浆油条',e:'🥛',p:8,s:0,t:['素'],sc:['alone'],tm:['breakfast']},
  {n:'皮蛋瘦肉粥',e:'🥣',p:12,s:0,t:['荤'],sc:['alone'],tm:['breakfast']},
  {n:'牛肉面',e:'🍜',p:22,s:1,t:['荤','牛羊'],sc:['alone','colleagues'],tm:['lunch','dinner']},
  {n:'羊肉串',e:'🍢',p:6,s:2,t:['荤','牛羊'],sc:['friends'],tm:['dinner','night']},
  {n:'披萨',e:'🍕',p:65,s:1,t:['荤'],sc:['friends','couple'],tm:['lunch','dinner']},
  {n:'汉堡',e:'🍔',p:30,s:1,t:['荤','猪'],sc:['alone','colleagues'],tm:['lunch','dinner','night']},
  {n:'炸鸡',e:'🍗',p:40,s:1,t:['荤','猪'],sc:['alone','friends'],tm:['lunch','dinner','night']},
  {n:'凉皮',e:'🥗',p:14,s:0,t:['素'],sc:['alone','colleagues'],tm:['lunch']},
  {n:'肉夹馍',e:'🥙',p:15,s:1,t:['荤','猪'],sc:['alone'],tm:['lunch','dinner','night']},
  {n:'煲仔饭',e:'🍚',p:28,s:1,t:['荤'],sc:['alone','colleagues'],tm:['lunch','dinner']},
  {n:'云吞面',e:'🍜',p:20,s:1,t:['荤','海鲜'],sc:['alone'],tm:['lunch','dinner']},

/* ---------- 存储 ---------- */
function loadSeen(){ try{return JSON.parse(localStorage.getItem(SEEN_KEY)||'{}');}catch(e){return {};} }
function saveSeen(o){ try{localStorage.setItem(SEEN_KEY,JSON.stringify(o));}catch(e){} }

function savePref(o){ try{localStorage.setItem(PREF_KEY,JSON.stringify(o));}catch(e){} }
function allFoods(){ return FOODS.concat(loadCustom()); }

/* ---------- 时段 ---------- */
function timeSlot(){
  const h = new Date().getHours();
  if(h<5) return 'night';
  if(h<10) return 'breakfast';
  if(h<14) return 'lunch';
  if(h<17) return 'tea';
  if(h<21) return 'dinner';
  return 'night';
}

/* ---------- 筛选 ---------- */
function passesAvoid(f){
  const a = state.avoid;
  if(a.includes('spicy') && f.s>0) return false;
  if(a.includes('seafood') && f.t.includes('海鲜')) return false;
  if(a.includes('redmeat') && f.t.includes('牛羊')) return false;
  if(a.includes('pork') && f.t.includes('猪')) return false;
  if(a.includes('cilantro') && f.t.includes('香菜')) return false;
  if(a.includes('veg') && !f.t.includes('素')) return false;
  return true;
}
function matchFull(f,slot){
  if(!passesAvoid(f)) return false;
  if(f.p>state.budget) return false;
  if(!f.sc.includes(state.scene)) return false;
  if(!f.tm.includes(slot)) return false;
  return true;
}
function matchNoTime(f,slot){
  if(!passesAvoid(f)) return false;
  if(f.p>state.budget) return false;
  if(!f.sc.includes(state.scene)) return false;
  return true;
}
function matchNoTimeScene(f){
  if(!passesAvoid(f)) return false;
  if(f.p>state.budget) return false;
  return true;
}
function matchNoTimeSceneBudget(f){
  if(!passesAvoid(f)) return false;
  return true;
}

/* 分级放宽构建候选池，返回最终候选数组 */
function buildPool(slot){
  const levels = [f=>matchFull(f,slot), f=>matchNoTime(f,slot), matchNoTimeScene, matchNoTimeSceneBudget];
  let pool = [];
  for(let i=0;i<levels.length;i++){
    pool = allFoods().filter(levels[i]);
    if(pool.length>=6) break;
  }
  // 排除刚选中的（避免立即重复）
  if(state.lastResultId) pool = pool.filter(f=>f.n!==state.lastResultId);
  return pool;
}

/* 从候选池挑最多 MAX_WHEEL 个放转盘：最近吃过的靠后（权重 1/(1+seen)），收藏的加权 */
/* 大类：用于搭配多样性判断 */
function catOf(f){
  if(f.t.includes('海鲜')) return '海鲜';
  if(f.t.includes('素')) return '素';
  if(f.t.includes('面')) return '主食';
  return '荤';
}
/* 上一顿的大类（基于历史第一条） */
function lastMealCat(){
  const h = loadHistory();
  if(h.length===0) return null;
  const f = allFoods().find(o=>o.n===h[0].n);
  return f ? catOf(f) : null;
}

/* 从候选池挑最多 MAX_WHEEL 个放转盘：综合偏好/收藏/近期去重/搭配 */
function pickWheel(slot){
  const pool = buildPool(slot);
  if(pool.length===0) return [];
  const seen = loadSeen();
  const fav = loadFav();
  const pref = loadPref();
  const lastCat = lastMealCat();
  const ranked = pool.map(f=>{
    let w = 1;
    // 偏好：被选中多、被换掉少 → 加权（tanh 平滑，避免单点爆炸）
    const score = (pref.pick[f.n]||0) - 0.6*(pref.skip[f.n]||0);
    w *= 1 + 0.45*Math.tanh(score);
    // 收藏常去
    if(fav.includes(f.n)) w *= 1.8;
    // 近期吃过降权（比旧逻辑更陡，促进轮换）
    w *= 1/(1+(seen[f.n]||0)*0.7);
    // 搭配：与上一顿同类则降权，促进荤素/类型交替
    if(lastCat && catOf(f)===lastCat) w *= 0.6;
    // 小抖动防完全固化
    w *= 0.85 + Math.random()*0.3;
    return {f, w};
  }).sort((a,b)=>b.w-a.w);
  return ranked.slice(0, Math.min(MAX_WHEEL, ranked.length)).map(x=>x.f);
}

/* ---------- 绘制转盘 ---------- */
function setupCanvas(){
  const wrap = canvas.parentElement;
  const cssSize = Math.min(wrap.clientWidth || 320, 340);
  wheelSize = Math.max(200, cssSize);
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(wheelSize*dpr);
  canvas.height = Math.round(wheelSize*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  drawWheel();
}

function drawWheel(){
  const N = state.wheelFoods.length;
  const size = wheelSize;
  ctx.clearRect(0,0,size,size);
  if(N===0){
    // 空盘
    ctx.save();
    ctx.translate(size/2,size/2);
    ctx.beginPath();ctx.arc(0,0,size/2-6,0,Math.PI*2);
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--line')||'#f2e4d8';
    ctx.fill();
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text2')||'#9b8a7c';
    ctx.font='800 15px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('没有符合的', 0, -10);
    ctx.fillText('去放宽条件吧', 0, 12);
    ctx.restore();
    return;
  }
  const seg = (Math.PI*2)/N;
  const r = size/2 - 8;
  ctx.save();
  ctx.translate(size/2,size/2);

  // 扇区（随转盘旋转）
  ctx.save();
  ctx.rotate(state.rotation);
  for(let i=0;i<N;i++){
    const a0=i*seg, a1=(i+1)*seg;
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.arc(0,0,r,a0,a1);
    ctx.closePath();
    ctx.fillStyle = SLICE_COLORS[i%SLICE_COLORS.length];
    ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.85)';
    ctx.lineWidth=2;
    ctx.stroke();
  }
  ctx.restore();

  // 外圈描边
  ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);
  ctx.strokeStyle='rgba(255,255,255,.95)';ctx.lineWidth=5;ctx.stroke();

  // 文字：屏幕水平 upright，落在扇区重心，绝不旋转/重叠
  for(let i=0;i<N;i++){
    const f = state.wheelFoods[i];
    const mid = i*seg + seg/2 + state.rotation;
    const rr = r*0.62;
    const x = Math.cos(mid)*rr;
    const y = Math.sin(mid)*rr;
    const base = SLICE_COLORS[i%SLICE_COLORS.length];
    const avail = 2*rr*Math.sin(seg/2) - 10; // 扇区弦宽可用空间
    ctx.save();
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    // emoji
    ctx.font='16px -apple-system,"PingFang SC",sans-serif';
    ctx.fillStyle = textColorFor(base);
    ctx.fillText(f.e, x, y-10);
    // 菜名：自适应字号，超长截断
    let fs=13;
    ctx.font='800 '+fs+'px -apple-system,"PingFang SC",sans-serif';
    let name=f.n;
    while(ctx.measureText(name).width>avail && fs>10){
      fs--;
      ctx.font='800 '+fs+'px -apple-system,"PingFang SC",sans-serif';
    }
    if(ctx.measureText(name).width>avail) name=trunc(name,4);
    if(textColorFor(base)==='#fff'){
      ctx.shadowColor='rgba(0,0,0,.28)';
      ctx.shadowBlur=3;
      ctx.shadowOffsetY=1;
    }
    ctx.fillText(name, x, y+10);
    ctx.restore();
  }
  ctx.restore();
}
/* 按扇区底色亮度自动选深/浅文字色，保证对比度 */
function textColorFor(hex){
  const c=parseInt(hex.slice(1),16);
  const R=(c>>16)&255, G=(c>>8)&255, B=c&255;
  const lum=0.299*R+0.587*G+0.114*B;
  return lum>178 ? '#6b3f1d' : '#ffffff';
}
function trunc(s,n){ return s.length>n ? s.slice(0,n-1)+'…' : s; }

/* ---------- 音效 / 震动 / toast ---------- */
let audioCtx=null, soundOn=true;
try{ soundOn = localStorage.getItem('eat-sound')!=='0'; }catch(e){}
function ensureAudio(){
  if(!soundOn) return;
  if(!audioCtx){ try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; } }
  if(audioCtx.state==='suspended') audioCtx.resume();
}
function blip(freq,vol,dur,type){
  if(!soundOn||!audioCtx) return;
  const t=audioCtx.currentTime;
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type=type||'square'; o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+0.005);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t+dur+0.02);
}
function tickSound(high){ blip(high?900:640, high?0.13:0.07, 0.06,'square'); }
function dingSound(){
  if(!soundOn||!audioCtx) return;
  const t=audioCtx.currentTime;
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type='sine'; o.frequency.setValueAtTime(880,t); o.frequency.exponentialRampToValueAtTime(1320,t+0.18);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.22,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.55);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t+0.6);
}
function buzz(){ if(navigator.vibrate){ try{ navigator.vibrate(8); }catch(e){} } }
function buzzEnd(){ if(navigator.vibrate){ try{ navigator.vibrate([18,40,18]); }catch(e){} } }
let toastTimer=null;
function toast(msg){
  const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),1800);
}
function topIndexAt(rot,N){
  const seg=(Math.PI*2)/N;
  const k=Math.round(((-Math.PI/2 - seg/2 - rot)/seg));
  return ((k%N)+N)%N;
}

/* ---------- 旋转 ---------- */
function spin(excludeId){
  if(state.spinning) return;
  if(state.wheelFoods.length===0){ refreshWheel(); if(state.wheelFoods.length===0){ hintEl.textContent='条件太苛刻啦，去放宽一下～'; return; } }
  state.spinning=true;
  spinBtn.disabled=true;
  spinBtn.classList.add('spinning');
  spinBtn.textContent='转…';
  ensureAudio();
  if(excludeId) state.lastResultId = excludeId;
  let lastTickIdx=-1;
  // 重新构建转盘（排除刚选中的）
  refreshWheel();
  if(state.wheelFoods.length===0){ state.spinning=false; spinBtn.disabled=false; hintEl.textContent='条件太苛刻啦，去放宽一下～'; return; }

  const N = state.wheelFoods.length;
  const idx = Math.floor(Math.random()*N);
  const seg = (Math.PI*2)/N;
  const thetaI = idx*seg + seg/2;     // 选中扇区中心（画布坐标，自+x轴顺时针）
  const topAngle = -Math.PI/2;        // 顶部指针
  const TAU = Math.PI*2;
  let desiredMod = (((topAngle - thetaI)%TAU)+TAU)%TAU;
  let curMod = (((state.rotation)%TAU)+TAU)%TAU;
  let diff = (((desiredMod - curMod)%TAU)+TAU)%TAU;
  const turns = 5 + Math.floor(Math.random()*2); // 5~6 圈
  const target = state.rotation + turns*TAU + diff;
  const start = state.rotation;
  const dur = 3800 + Math.random()*700;
  const t0 = performance.now();
  hintEl.textContent='命运正在旋转…';

  function frame(now){
    let p = Math.min(1,(now-t0)/dur);
    const e = 1 - Math.pow(1-p,4); // easeOutQuart
    state.rotation = start + (target-start)*e;
    const ti = topIndexAt(state.rotation,N);
    if(ti!==lastTickIdx){ lastTickIdx=ti; tickSound(); buzz(); }
    drawWheel();
    if(p<1) requestAnimationFrame(frame);
    else finish(idx);
  }
  requestAnimationFrame(frame);
}

function finish(idx){
  state.spinning=false;
  spinBtn.disabled=false;
  spinBtn.classList.remove('spinning');
  spinBtn.textContent='转';
  dingSound(); buzzEnd();
  const f = state.wheelFoods[idx];
  state.lastResultId = f.n;
  showResult(f);
  // 记录 seen / history
  const seen = loadSeen(); seen[f.n]=(seen[f.n]||0)+1; saveSeen(seen);
  pushHistory(f);
  // 记录正向偏好（最终选中的）
  const pref = loadPref();
  pref.pick[f.n] = (pref.pick[f.n]||0)+1;
  savePref(pref);
  renderProfile();
  updateRerollBtn();
  updateFavBtn();
  hintEl.textContent='就它了，别犹豫！';
}

/* ---------- 结果卡 ---------- */
function showResult(f){
  $('#rEmoji').textContent = f.e;
  $('#rName').textContent = f.n;
  $('#rPrice').textContent = '¥'+f.p;
  const spicy = ['不辣','微辣','中辣','重辣'][f.s] || '微辣';
  $('#rSpicy').textContent = '🌶️ '.repeat(Math.max(1,f.s)).trim() + ' ' + spicy;
  $('#rReason').textContent = reasonFor(f);
  $('#mapBtn').href = 'https://uri.amap.com/search?keyword='+encodeURIComponent(f.n);
  resultEl.classList.add('show');
  updateFavBtn();
  resultEl.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function reasonFor(f){
  const sr = {
    alone:'一个人也要好好吃饭，',
    colleagues:'和同事拼个餐，',
    couple:'约会就图个氛围，',
    family:'一家人围坐，',
    friends:'朋友聚会图热闹，'
  };
  const tr = {
    breakfast:'早起犒劳下自己，',
    lunch:'中午好好补一顿，',
    tea:'下午茶时间，',
    dinner:'晚上犒劳下自己，',
    night:'深夜解个馋，'
  };
  const tail = ['这顿稳了。','别犹豫了就它。','转盘选的，怪不到你头上。','今天命运站它。','吃就完事了。'];
  // 搭配建议（基于上一顿大类，与当前菜互补）
  let comboTip = '';
  const last = lastMealCat();
  if(last){
    const cur = catOf(f);
    if(last==='荤' && cur!=='荤') comboTip='刚好和上一顿错开，荤素搭配更舒服。';
    else if(last==='素' && cur==='荤') comboTip='这顿补点肉，均衡一下。';
    else if(last==='海鲜' && cur!=='海鲜') comboTip='换换口味，今天不整海鲜了。';
    else if(last===cur) comboTip='又是'+last+'，连着两顿同口儿，介意就换一个。';
  }
  return sr[state.scene] + tr[timeSlot()] + comboTip + tail[Math.floor(Math.random()*tail.length)];
}

/* ---------- 历史 ---------- */
function loadHistory(){ try{return JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');}catch(e){return [];} }
function pushHistory(f){
  let h = loadHistory().filter(x=>x.n!==f.n);
  h.unshift({n:f.n,e:f.e});
  h = h.slice(0,20);
  try{localStorage.setItem(HISTORY_KEY,JSON.stringify(h));}catch(e){}
  renderHistory();
}
function renderHistory(){
  const list = $('#historyList');
  const h = loadHistory();
  if(h.length===0){ list.innerHTML = '<span class="history-empty">还没有记录，转一次试试～</span>'; return; }
  list.innerHTML = h.map(x=>`<span class="history-item" data-n="${x.n}">${x.e} ${x.n}</span>`).join('');
  list.querySelectorAll('.history-item').forEach(el=>{
    el.addEventListener('click',()=>{
      const f=allFoods().find(o=>o.n===el.dataset.n);
      if(!f) return;
      state.lastResultId=f.n;
      let hh=loadHistory().filter(o=>o.n!==f.n); hh.unshift({n:f.n,e:f.e});
      try{localStorage.setItem(HISTORY_KEY,JSON.stringify(hh.slice(0,20)));}catch(e){}
      showResult(f); toast('再看一眼：'+f.n);
    });
  });
}

/* ---------- 命运懂你 · 偏好画像 ---------- */
function renderProfile(){
  const el = $('#profileBody');
  const pref = loadPref();
  const entries = Object.keys(pref.pick||{}).map(n=>({n, p:pref.pick[n]})).sort((a,b)=>b.p-a.p);
  const top = entries.slice(0,3);
  if(top.length===0){ el.innerHTML = '<span class="pp-empty">还没转够次数，命运正在认识你…多转几顿它就懂你了 🐴</span>'; return; }
  const all = FOODS.concat(loadCustom());
  const liked = top.map(t=>all.find(o=>o.n===t.n)).filter(Boolean);
  let insight = '你最常选：'+top.map(t=>t.n).join('、')+'。';
  const spicy = liked.reduce((s,f)=>s+f.s,0)/liked.length;
  if(spicy>=2) insight += '看来是重口味星人 🌶️';
  else if(spicy===0) insight += '偏好清淡 🥗';
  else insight += '口味适中，不挑辣。';
  el.innerHTML = '<div class="pp-top">'+top.map(t=>'<span class="pp-chip">'+t.n+' ×'+t.p+'</span>').join('')+'</div>'+
    '<div class="pp-insight">'+insight+'</div>';
}

/* ---------- 换一个（限次） ---------- */
function updateRerollBtn(){
  if(state.rerollLeft<=0){
    rerollBtn.disabled=true;
    rerollBtn.textContent='不能换了，认命吧';
  }else{
    rerollBtn.disabled=false;
    rerollBtn.textContent='换一个（剩'+state.rerollLeft+'次）';
  }
}
rerollBtn.addEventListener('click',()=>{
  if(state.spinning || state.rerollLeft<=0 || !state.lastResultId) return;
  state.rerollLeft--;
  // 记录负反馈（被换掉的 = 不太想吃）
  const pf = loadPref();
  pf.skip[state.lastResultId] = (pf.skip[state.lastResultId]||0)+1;
  savePref(pf);
  updateRerollBtn();
  spin(state.lastResultId);
});

/* ---------- 刷新转盘候选 ---------- */
function refreshWheel(){
  const pool = pickWheel(timeSlot());
  state.wheelFoods = pool;
  drawWheel();
  if(pool.length===0){
    hintEl.textContent='没有符合条件的，去放宽条件吧～';
    spinBtn.disabled=true;
  }else{
    spinBtn.disabled=false;
    if(!resultEl.classList.contains('show')) hintEl.textContent='点击中间按钮，让命运做决定';
  }
}

/* ---------- 设置面板交互 ---------- */
function renderSceneChips(){
  $('#sceneChips').innerHTML = SCENES.map(s=>
    `<span class="chip ${s.k===state.scene?'on':''}" data-k="${s.k}">${s.e} ${s.label}</span>`).join('');
  $('#sceneChips').querySelectorAll('.chip').forEach(c=>{
    c.addEventListener('click',()=>{ state.scene=c.dataset.k; renderSceneChips(); refreshWheel(); });
  });
}
function renderAvoidChips(){
  $('#avoidChips').innerHTML = AVOIDS.map(a=>
    `<span class="chip ${state.avoid.includes(a.k)?'on':''}" data-k="${a.k}">${a.label}</span>`).join('');
  $('#avoidChips').querySelectorAll('.chip').forEach(c=>{
    c.addEventListener('click',()=>{
      const k=c.dataset.k;
      if(state.avoid.includes(k)) state.avoid=state.avoid.filter(x=>x!==k);
      else state.avoid.push(k);
      renderAvoidChips(); refreshWheel();
    });
  });
}
const budgetInput = $('#budget');
function syncBudget(){
  budgetInput.style.setProperty('--fill', ((budgetInput.value-8)/(200-8)*100)+'%');
  $('#budgetVal').textContent='¥'+budgetInput.value;
}
budgetInput.addEventListener('input',()=>{
  state.budget=+budgetInput.value; syncBudget(); refreshWheel();
});

/* ---------- 我的食物（自定义库） ---------- */
let cf = {tags:[],scenes:[],slots:[],spicy:1};
function renderCustomList(){
  const list=$('#customList'); const arr=loadCustom();
  if(arr.length===0){ list.innerHTML='<span class="history-empty">还没有自己的菜，点“＋ 添加”把常吃的加进来～</span>'; return; }
  list.innerHTML=arr.map((x,i)=>`<span class="custom-item">${x.e} ${x.n}<button class="del" data-i="${i}">✕</button></span>`).join('');
  list.querySelectorAll('.del').forEach(b=>b.addEventListener('click',()=>{
    const a=loadCustom(); const name=a[+b.dataset.i].n; a.splice(+b.dataset.i,1);
    saveCustom(a); renderCustomList(); refreshWheel(); toast('已删除：'+name);
  }));
}
function bindMultiChips(container, getArr){
  $(container).querySelectorAll('.chip').forEach(c=>{
    c.addEventListener('click',()=>{
      const k=c.dataset.k; const arr=getArr();
      if(arr.includes(k)){ arr.splice(arr.indexOf(k),1); c.classList.remove('on'); }
      else { arr.push(k); c.classList.add('on'); }
    });
  });
}
function openCustomForm(){
  cf={tags:[],scenes:[],slots:[],spicy:1};
  $('#cfName').value=''; $('#cfEmoji').value=''; $('#cfPrice').value=30;
  $('#cfSpicy').value=1; $('#cfSpicyVal').textContent='微辣';
  $('#cfTags').innerHTML=TAGS.map(t=>`<span class="chip" data-k="${t.k}">${t.label}</span>`).join('');
  $('#cfScenes').innerHTML=SCENES.map(s=>`<span class="chip" data-k="${s.k}">${s.e} ${s.label}</span>`).join('');
  $('#cfSlots').innerHTML=Object.keys(SLOT_LABEL).map(k=>`<span class="chip" data-k="${k}">${SLOT_LABEL[k]}</span>`).join('');
  bindMultiChips('#cfTags',()=>cf.tags);
  bindMultiChips('#cfScenes',()=>cf.scenes);
  bindMultiChips('#cfSlots',()=>cf.slots);
  $('#customForm').style.display='block';
}
$('#cfSpicy').addEventListener('input',()=>{
  cf.spicy=+$('#cfSpicy').value;
  $('#cfSpicyVal').textContent=['不辣','微辣','中辣','重辣'][cf.spicy];
});
$('#addCustomBtn').addEventListener('click',openCustomForm);
$('#cfCancel').addEventListener('click',()=>{ $('#customForm').style.display='none'; });
$('#cfSave').addEventListener('click',()=>{
  const n=$('#cfName').value.trim();
  const e=$('#cfEmoji').value.trim()||'🍽️';
  const p=Math.max(1,(+$('#cfPrice').value)||30);
  if(!n){ toast('先写个菜名吧'); return; }
  const item={
    n,e,p,s:cf.spicy,
    t: cf.tags.length?cf.tags.slice():['荤'],
    sc: cf.scenes.length?cf.scenes.slice():['alone'],
    tm: cf.slots.length?cf.slots.slice():['lunch','dinner']
  };
  const a=loadCustom();
  const exist=a.findIndex(x=>x.n===n);
  if(exist>=0){ a[exist]=item; } else { a.push(item); }
  saveCustom(a); renderCustomList(); $('#customForm').style.display='none'; refreshWheel();
  toast('已加入转盘：'+n);
});

/* ---------- 收藏（常去） ---------- */
function updateFavBtn(){
  const on=loadFav().includes(state.lastResultId);
  const b=$('#favBtn');
  b.textContent=on?'★ 已收藏':'⭐ 收藏';
  b.classList.toggle('faved',on);
}
$('#favBtn').addEventListener('click',()=>{
  if(!state.lastResultId) return;
  const n=state.lastResultId;
  let fav=loadFav();
  if(fav.includes(n)){ fav=fav.filter(x=>x!==n); saveFav(fav); toast('已取消收藏'); }
  else { fav.unshift(n); saveFav(fav); toast('★ 已加入常去，以后更常抽到'); }
  updateFavBtn();
});

/* ---------- 顶部按钮 ---------- */
$('#toggleSettings').addEventListener('click',function(){
  const s=$('#settings'); const open=s.classList.toggle('open');
  this.classList.toggle('active',open);
});
$('#resetBtn').addEventListener('click',()=>{
  state.scene='alone'; state.budget=60; state.avoid=[]; state.lastResultId=null; state.rerollLeft=MAX_REROLL;
  budgetInput.value=60; syncBudget();
  resultEl.classList.remove('show');
  renderSceneChips(); renderAvoidChips(); refreshWheel(); updateRerollBtn();
  hintEl.textContent='点击中间按钮，让命运做决定';
});
$('#clearHistory').addEventListener('click',()=>{
  try{localStorage.removeItem(HISTORY_KEY);}catch(e){}
  renderHistory();
});
spinBtn.addEventListener('click',()=>spin(null));

/* ---------- 音效开关 ---------- */
const soundBtn=$('#soundBtn');
function renderSoundBtn(){ soundBtn.textContent=soundOn?'🔊 音效':'🔇 静音'; soundBtn.classList.toggle('active',soundOn); }
soundBtn.addEventListener('click',()=>{
  soundOn=!soundOn;
  try{ localStorage.setItem('eat-sound',soundOn?'1':'0'); }catch(e){}
  renderSoundBtn(); if(soundOn) ensureAudio();
});

/* ---------- 初始化 ---------- */
window.addEventListener('resize',setupCanvas);
function init(){
  renderSceneChips();
  renderAvoidChips();
  syncBudget();
  renderHistory();
  renderCustomList();
  renderSoundBtn();
  setupCanvas();
  refreshWheel();
  updateRerollBtn();
  renderProfile();
}
init();
</script>
</body>
</html>
